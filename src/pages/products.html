<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/output.css" />
  </head>
  <body>
    <!--header start-->
    <header
  id="header"
  class="sticky top-0 z-50 bg-primary text-text-white py-4 border-b border-border shadow-md"
  >
      <div
        class="container-custom h-full flex flex-col md:flex-row md:items-center gap-5"
      >
        <div
          class="logo flex items-center justify-center md:justify-evenly shrink-0"
        >
          <img
            src="../../assets/category-assets/logonew.png"
            alt="logo"
            class="w-35 h-auto"
          />
          <div class="ms-3 relative hidden md:flex group">
            <!-- Category Button -->
            <a
              href="#"
              class="flex items-center gap-2 text-white hover:text-accent"
            >
              <span class="text-sm">Category</span>
  
              <img
                src="../../assets/category-assets/down-arrow.png"
                alt="arrow"
                class="w-4 h-4 invert transition-transform duration-300 group-hover:rotate-180"
              />
            </a>
  
            <!-- Dropdown -->
            <div class="absolute left-0 top-full hidden group-hover:block z-50">
              <div
                id="category-dropdown"
                class="w-64 mt-2 bg-white rounded-2xl shadow-xl border border-border overflow-hidden"
              ></div>
            </div>
          </div>
        </div>
        <div class="search flex-1">
          <div
            class="search-container flex items-center h-11 bg-white rounded-full overflow-hidden border border-gray-300 shadow-sm"
          >
            <!-- Search Input -->
            <div class="search-input flex-1 px-5">
              <input
                id="search-input"
                type="text"
                placeholder="Try searching for Your Fav Items"
                class="w-full h-full text-sm text-gray-700 placeholder:text-gray-400 outline-none"
              />
            </div>
  
            <!-- Search Button -->
            <button
              id="search-btn"
              class="search-btn flex items-center justify-center w-14 cursor-pointer h-full bg-accent hover:bg-accent-hover transition-colors"
            >
              <img
                src="../../assets/category-assets/search.png"
                alt="Search"
                class="w-5 h-5 invert"
              />
            </button>
          </div>
        </div>
        <div
          class="flex justify-center rewards shrink-0 text-white text-sm items-center gap-6"
        >
          <a href="./wishlist.html" class=" relative flex items-center gap-2 hover:text-accent group">
            <svg
              class="w-5 h-5 stroke-current"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"
              />
            </svg>
            <span
            id="wishlist-count"
            class="hidden absolute -top-2 -right-2 bg-accent text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-semibold"
          >
          </span>
            <span class="hidden lg:inline">Wishlist</span>
          </a>
          <a href="./cart.html" class="flex items-center gap-2 hover:text-accent group">
    <div class="relative flex">
      <svg
      class="w-5 h-5 stroke-current"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <circle cx="9" cy="20" r="1" />
      <circle cx="18" cy="20" r="1" />
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L21 7H7"
      />
    </svg>
  
    <span class="hidden lg:inline">Cart</span>
    <span
    id="cart-count"
    class="absolute -top-2 -right-2 bg-accent text-white text-xs w-5 h-5 rounded-full flex items-center justify-center"
  >
    0
  </span>
    </div>
          </a>
  
          <a href="#" class="flex items-center gap-2 hover:text-accent group">
            <svg
              class="w-5 h-5 stroke-current"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M20 21a8 8 0 0 0-16 0"
              />
              <circle
                cx="12"
                cy="8"
                r="4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
  
            <span class="hidden lg:inline">Account</span>
          </a>
        </div>
      </div>
    </header>
    <!--header ends-->

    <!--products section starts-->
    <section class="py-10">
      <div class="container-custom">
        <div
          class="flex flex-col md:flex-row md:items-center md:justify-between gap-4"
        >
          <!-- <h2
            id="products-heading"
            class="text-3xl font-bold text-text-primary"
          >
            All Products
          </h2> -->

          <div class="relative w-full md:w-56">
            <select
              id="sort-products"
              class="w-full appearance-none rounded-xl border border-border bg-white px-4 py-3 pr-12 text-sm font-medium text-text-primary shadow-sm outline-none transition-all duration-200 hover:border-accent focus:border-accent focus:ring-2 focus:ring-accent/20 cursor-pointer"
            >
              <option value="">Sort By</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
              <option value="az">A - Z</option>
              <option value="za">Z - A</option>
              <option value="rating">Highest Rated</option>
            </select>

            <div
              class="pointer-events-none absolute inset-y-0 right-4 flex items-center text-text-secondary"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M19 9l-7 7-7-7"
                />
              </svg>
            </div>
          </div>
        </div>
        <div
          id="products-container"
          class="mt-8 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"
        ></div>
      </div>
    </section>
    <!--products section ends-->

    <script type="module" src="../js/products.js"></script>
  </body>
</html>
