<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Order Success</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/output.css" />
  </head>

  <body class="bg-background font-[Poppins]">
    <main class="min-h-screen flex items-center">
      <div class="container-custom flex justify-center w-full py-10">
        <div
          class="w-full max-w-xl bg-white border border-border rounded-3xl shadow-lg p-8 sm:p-10 text-center"
        >
          <!-- Success Icon -->
          <div
          class="w-28 h-28 rounded-full border-[5px] border-green-500 flex items-center justify-center mx-auto"
        >
         
          
            <svg
              class="w-20 h-20 text-green-600"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="3"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M5 13l4 4L19 7"
              />
            </svg>
          
        </div>
         
          <!-- Heading -->
          <h1 class="mt-8 text-3xl sm:text-4xl font-bold text-text-primary">
            Order Placed Successfully!
          </h1>

          <!-- Description -->
          <p class="mt-5 text-text-secondary leading-7 max-w-md mx-auto">
            Thank you for shopping with VendorHub. Your order has been received
            successfully and is now being processed. You can track your order
            anytime from your Orders page.
          </p>

          <!-- Buttons -->
          <div class="mt-10 flex flex-col sm:flex-row justify-center gap-4">
            <a
              href="products.html"
              class="inline-flex items-center justify-center px-8 py-3 rounded-full bg-accent text-white font-medium hover:bg-accent-hover transition"
            >
              Continue Shopping
            </a>

            <a
              href="orders.html"
              class="inline-flex items-center justify-center px-8 py-3 rounded-full border-2 border-primary text-primary font-medium hover:bg-primary hover:text-white transition"
            >
              View My Orders
            </a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
