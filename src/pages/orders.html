<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders | VendorHub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/output.css" />
  </head>

  <body >

    
    <!--header start-->
    <header
      id="header"
      class="sticky top-0 z-50 bg-primary text-text-white py-4 border-b border-border shadow-md"
    >
      <div
        class="container-custom h-full flex flex-col md:flex-row md:items-center gap-5"
      >
        <div
          class="logo flex items-center justify-center md:justify-evenly shrink-0"
        >
          <a href="products.html">
            <img
              src="../../assets/category-assets/logonew.png"
              alt="VendorHub Logo"
              class="w-35 h-auto cursor-pointer"
            />
          </a>
        </div>
        <div class="search flex-1">
          <div
            class="search-container flex items-center h-11 bg-white rounded-full overflow-hidden border border-gray-300 shadow-sm"
          >
            <!-- Search Input -->
            <div class="search-input flex-1 px-5">
              <input
                id="search-input"
                type="text"
                placeholder="Try searching for Your Fav Items"
                class="w-full h-full text-sm text-gray-700 placeholder:text-gray-400 outline-none"
              />
            </div>

            <!-- Search Button -->
            <button
              id="search-btn"
              class="search-btn flex items-center justify-center w-14 cursor-pointer h-full bg-accent hover:bg-accent-hover transition-colors"
            >
              <img
                src="../../assets/category-assets/search.png"
                alt="Search"
                class="w-5 h-5 invert"
              />
            </button>
          </div>
        </div>
        <div
          class="flex justify-center rewards shrink-0 text-white text-sm items-center gap-6"
        >
          <a
            href="./wishlist.html"
            class="relative flex items-center gap-2 hover:text-accent group"
          >
            <svg
              class="w-5 h-5 stroke-current"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"
              />
            </svg>
            <span
              id="wishlist-count"
              class="hidden absolute -top-2 -right-2 bg-accent text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-semibold"
            >
            </span>
            <span class="hidden lg:inline">Wishlist</span>
          </a>
          <a href="#" class="flex items-center gap-2 hover:text-accent group">
            <div class="relative flex">
              <svg
                class="w-5 h-5 stroke-current"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="9" cy="20" r="1" />
                <circle cx="18" cy="20" r="1" />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L21 7H7"
                />
              </svg>

              <span class="hidden lg:inline">Cart</span>
              <span
                id="cart-count"
                class="absolute -top-2 -right-2 bg-accent text-white text-xs w-5 h-5 rounded-full flex items-center justify-center"
              >
                0
              </span>
            </div>
          </a>

          <div class="relative">
            <!-- Account Button -->
            <button
              id="account-btn"
              class="flex items-center gap-2 hover:text-accent transition cursor-pointer"
            >
              <svg
                class="w-5 h-5 stroke-current"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M20 21a8 8 0 0 0-16 0"
                />
                <circle
                  cx="12"
                  cy="8"
                  r="4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>

              <span class="hidden lg:inline">Account</span>
            </button>

            <!-- Dropdown -->
            <div
              id="account-dropdown"
              class="hidden absolute right-0 top-full mt-2 w-40 bg-white rounded-xl border  border-border shadow-xl overflow-hidden z-50"
            >
            <a
            href="orders.html"
            class="block px-4 py-3 text-text-primary hover:bg-background hover:text-accent transition"
          >
            My Orders
          </a>

              <button
                id="logout-btn"
                class="w-full text-left px-4 py-3 text-red-600 hover:bg-red-600  hover:text-white transition cursor-pointer"
              >
                 Logout
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>
    <!--header ends-->

    <main class="container-custom py-10">


      <section
        id="orders-container"
        class="space-y-8"
      >

      </section>

    </main>

   

 

    <script type="module" src="../js/orders.js"></script>

  </body>
</html>
