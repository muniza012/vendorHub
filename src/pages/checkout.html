<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/output.css" />
  </head>
  <body>
    <!--header start-->
    <header
      id="header"
      class="sticky top-0 z-50 bg-primary text-text-white py-4 border-b border-border shadow-md"
    >
      <div
        class="container-custom h-full flex flex-col md:flex-row md:items-center gap-5"
      >
        <div
          class="logo flex items-center justify-center md:justify-evenly shrink-0"
        >
          <img
            src="../../assets/category-assets/logonew.png"
            alt="logo"
            class="w-35 h-auto"
          />
          <div class="ms-3 relative hidden md:flex group">
            <!-- Category Button -->
            <!-- <a
              href="#"
              class="flex items-center gap-2 text-white hover:text-accent"
            >
              <span class="text-sm">Category</span>

              <img
                src="../../assets/category-assets/down-arrow.png"
                alt="arrow"
                class="w-4 h-4 invert transition-transform duration-300 group-hover:rotate-180"
              />
            </a> -->

            <!-- Dropdown -->
            <div class="absolute left-0 top-full hidden group-hover:block z-50">
              <div
                id="category-dropdown"
                class="w-64 mt-2 bg-white rounded-2xl shadow-xl border border-border overflow-hidden"
              ></div>
            </div>
          </div>
        </div>
        <div class="search flex-1">
          <div
            class="search-container flex items-center h-11 bg-white rounded-full overflow-hidden border border-gray-300 shadow-sm"
          >
            <!-- Search Input -->
            <div class="search-input flex-1 px-5">
              <input
                id="search-input"
                type="text"
                placeholder="Try searching for Your Fav Items"
                class="w-full h-full text-sm text-gray-700 placeholder:text-gray-400 outline-none"
              />
            </div>

            <!-- Search Button -->
            <button
              id="search-btn"
              class="search-btn flex items-center justify-center w-14 cursor-pointer h-full bg-accent hover:bg-accent-hover transition-colors"
            >
              <img
                src="../../assets/category-assets/search.png"
                alt="Search"
                class="w-5 h-5 invert"
              />
            </button>
          </div>
        </div>
        <div
          class="flex justify-center rewards shrink-0 text-white text-sm items-center gap-6"
        >
          <a
            href="./wishlist.html"
            class="relative flex items-center gap-2 hover:text-accent group"
          >
            <svg
              class="w-5 h-5 stroke-current"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"
              />
            </svg>
            <span
              id="wishlist-count"
              class="hidden absolute -top-2 -right-2 bg-accent text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-semibold"
            >
            </span>
            <span class="hidden lg:inline">Wishlist</span>
          </a>
          <a href="#" class="flex items-center gap-2 hover:text-accent group">
            <div class="relative flex">
              <svg
                class="w-5 h-5 stroke-current"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="9" cy="20" r="1" />
                <circle cx="18" cy="20" r="1" />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L21 7H7"
                />
              </svg>

              <span class="hidden lg:inline">Cart</span>
              <span
                id="cart-count"
                class="absolute -top-2 -right-2 bg-accent text-white text-xs w-5 h-5 rounded-full flex items-center justify-center"
              >
                0
              </span>
            </div>
          </a>

          <a href="#" class="flex items-center gap-2 hover:text-accent group">
            <svg
              class="w-5 h-5 stroke-current"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M20 21a8 8 0 0 0-16 0"
              />
              <circle
                cx="12"
                cy="8"
                r="4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

            <span class="hidden lg:inline">Account</span>
          </a>
        </div>
      </div>
    </header>
    <!--header ends-->

    <main class="container-custom py-10">

      <h1 class="text-3xl font-bold mb-8">
        Checkout
      </h1>
    
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    
        <!-- ================= LEFT ================= -->
    
        <section class="lg:col-span-2">
    
          <div class="bg-white rounded-2xl border border-border p-6">
    
            <h2 class="text-2xl font-semibold mb-8">
              Shipping Information
            </h2>
    
            <form id="checkout-form" class="space-y-6">
    
              <!-- Name + Phone -->
    
              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
    
                <div>
    
                  <label class="block mb-2 font-medium">
                    Full Name
                  </label>
    
                  <input
                    id="name"
                    type="text"
                    required
                    minlength="3"
                    autocomplete="name"
                    placeholder="Enter your full name"
                    class="w-full rounded-lg border border-border p-3 outline-none focus:border-accent"
                  >
    
                </div>
    
                <div>
    
                  <label class="block mb-2 font-medium">
                    Phone Number
                  </label>
    
                  <input
                    id="phone"
                    type="tel"
                    required
                    maxlength="11"
                    inputmode="numeric"
                    autocomplete="tel"
                    placeholder="03XXXXXXXXX"
                    class="w-full rounded-lg border border-border p-3 outline-none focus:border-accent"
                  >
    
                </div>
    
              </div>
    
              <!-- Email -->
    
              <div>
    
                <label class="block mb-2 font-medium">
                  Email Address
                </label>
    
                <input
                  id="email"
                  type="email"
                  required
                  autocomplete="email"
                  placeholder="example@email.com"
                  class="w-full rounded-lg border border-border p-3 outline-none focus:border-accent"
                >
    
              </div>
    
              <!-- Address -->
    
              <div>
    
                <label class="block mb-2 font-medium">
                  Street Address
                </label>
    
                <textarea
                  id="address"
                  rows="4"
                  required
                  autocomplete="street-address"
                  placeholder="House No, Street, Area"
                  class="w-full rounded-lg border border-border p-3 outline-none resize-none focus:border-accent"
                ></textarea>
    
              </div>
    
              <!-- City + Postal -->
    
              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
    
                <div>
    
                  <label class="block mb-2 font-medium">
                    City
                  </label>
    
                  <input
                    id="city"
                    type="text"
                    required
                    autocomplete="address-level2"
                    placeholder="Karachi"
                    class="w-full rounded-lg border border-border p-3 outline-none focus:border-accent"
                  >
    
                </div>
    
                <div>
    
                  <label class="block mb-2 font-medium">
                    Postal Code
                  </label>
    
                  <input
                    id="postal"
                    type="text"
                    required
                    autocomplete="postal-code"
                    placeholder="74000"
                    class="w-full rounded-lg border border-border p-3 outline-none focus:border-accent"
                  >
    
                </div>
    
              </div>
    
              <!-- Payment -->
    
              <div class="pt-3">
    
                <h3 class="text-xl font-semibold mb-5">
                  Payment Method
                </h3>
    
                <div class="space-y-4">
    
                  <label class="flex items-center gap-3 cursor-pointer">
    
                    <input
                      type="radio"
                      name="payment"
                      checked
                    >
    
                    <span>
                      Cash on Delivery
                    </span>
    
                  </label>
    
                  <label class="flex items-center gap-3 opacity-50 cursor-not-allowed">
    
                    <input
                      type="radio"
                      disabled
                    >
    
                    <span>
                      Credit / Debit Card (Coming Soon)
                    </span>
    
                  </label>
    
                  <label class="flex items-center gap-3 opacity-50 cursor-not-allowed">
    
                    <input
                      type="radio"
                      disabled
                    >
    
                    <span>
                      JazzCash / EasyPaisa (Coming Soon)
                    </span>
    
                  </label>
    
                </div>
    
              </div>
    
              <!-- Terms -->
    
              <label class="flex items-start gap-3 pt-3 cursor-pointer">
    
                <input
                  id="terms"
                  type="checkbox"
                  class="mt-1"
                >
    
                <span class="text-sm text-text-secondary">
    
                  I agree to VendorHub's Terms & Conditions and Privacy Policy.
    
                </span>
    
              </label>
    
            </form>
    
          </div>
    
        </section>
    
        <!-- ================= RIGHT ================= -->
    
        <aside
          class="bg-white rounded-2xl border border-border p-6 h-fit lg:sticky lg:top-24"
        >
    
          <h2 class="text-2xl font-semibold mb-6">
            Order Summary
          </h2>
    
          <div
            id="checkout-summary"
            class="space-y-5"
          >
    
          </div>
    
          <button
            id="place-order-btn"
            class="w-full mt-8 py-4 rounded-full bg-accent text-white font-medium hover:bg-accent-hover transition"
          >
    
            Place Order
    
          </button>
    
        </aside>
    
      </div>
    
    </main>
   
    <script type="module" src="../js/checkout.js"></script>
  </body>
</html>
