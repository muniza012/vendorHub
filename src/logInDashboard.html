<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/output.css" />
  </head>
  <body class="bg-background text-text-primary font-poppins">
    <!-- Header -->
    <header
      id="header"
      class="bg-primary text-white border-b border-border"
    >
      <div class="container-custom h-10 flex items-center">
        Utility Navigation
      </div>

      <div class="container-custom h-20 flex items-center">
        Main Header
      </div>
    </header>

    <!-- Category Carousel -->
    <section
      id="category-carousel"
      class="h-24 border-b border-border"
    >
      <div class="container-custom h-full flex items-center">
        Category Carousel
      </div>
    </section>

    <main>
      <!-- Hero Banner -->
      <section
        id="hero-banner"
        class="h-112.5 border-b border-border"
      >
        <div class="container-custom h-full flex items-center">
          Hero Banner
        </div>
      </section>

      <!-- Flash Deals -->
      <section
        id="flash-deals"
        class="h-125 border-b border-border"
      >
        <div class="container-custom h-full flex items-center">
          Flash Deals
        </div>
      </section>

      <!-- Favourites -->
      <section
        id="favourites"
        class="h-75 border-b border-border"
      >
        <div class="container-custom h-full flex items-center">
          Favourites
        </div>
      </section>

      <!-- Top Stores -->
      <section
        id="top-stores"
        class="h-87.5 border-b border-border"
      >
        <div class="container-custom h-full flex items-center">
          Top Stores
        </div>
      </section>

      <!-- Deals -->
      <section
        id="deals"
        class="h-87.5 border-b border-border"
      >
        <div class="container-custom h-full flex items-center">
          Deals
        </div>
      </section>

      <!-- Categories -->
      <section
        id="categories"
        class="h-125 border-b border-border"
      >
        <div class="container-custom h-full flex items-center">
          Categories
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer
      id="footer"
      class="h-62.5 border-b border-border"
    >
      <div class="container-custom h-full flex items-center">
        Footer
      </div>
    </footer>
  </body>
</html>
